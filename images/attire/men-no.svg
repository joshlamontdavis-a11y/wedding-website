<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Cartoon guest in a bright hot pink suit and magenta tie, wearing sunglasses">
  <!-- Not acceptable: a blinding hot pink suit and tie -->
  <circle cx="120" cy="165" r="112" fill="#fdeaf3"/>
  <ellipse cx="120" cy="302" rx="58" ry="6" fill="#000" opacity="0.07"/>

  <!-- Pants and shoes -->
  <rect x="100" y="196" width="18" height="96" rx="3" fill="#ff3d98"/>
  <rect x="122" y="196" width="18" height="96" rx="3" fill="#ff3d98"/>
  <ellipse cx="106" cy="295" rx="13" ry="5.5" fill="#ffffff" stroke="#e7c7d6" stroke-width="1.5"/>
  <ellipse cx="134" cy="295" rx="13" ry="5.5" fill="#ffffff" stroke="#e7c7d6" stroke-width="1.5"/>

  <!-- Sleeves: one arm up in a finger-guns pose -->
  <path d="M99 110 Q89 150 86 194" stroke="#ff5aa8" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M141 110 Q164 104 172 76" stroke="#ff5aa8" stroke-width="15" fill="none" stroke-linecap="round"/>
  <circle cx="86" cy="200" r="6" fill="#e2b590"/>
  <circle cx="174" cy="68" r="6" fill="#e2b590"/>
  <path d="M177 63 l10 -8" stroke="#e2b590" stroke-width="4" stroke-linecap="round"/>

  <!-- Jacket -->
  <path d="M95 104 Q120 96 145 104 L151 204 Q120 210 89 204 Z" fill="#ff5aa8"/>
  <path d="M110 100 L120 136 L130 100 Z" fill="#ffffff"/>
  <path d="M110 100 L104 128 L120 146 M130 100 L136 128 L120 146" stroke="#e0408d" stroke-width="2" fill="none"/>
  <path d="M120 146 V204" stroke="#e0408d" stroke-width="1.5"/>
  <circle cx="120" cy="160" r="2.6" fill="#ffd84d"/>
  <circle cx="120" cy="178" r="2.6" fill="#ffd84d"/>

  <!-- Pocket flower -->
  <circle cx="136" cy="122" r="5" fill="#ffd84d"/>
  <circle cx="136" cy="122" r="2" fill="#ff7a1a"/>

  <!-- Polka-dot magenta tie -->
  <path d="M116 103 h8 l1.5 5 h-11 z" fill="#b8005f"/>
  <path d="M115 108 h10 l3.5 28 -8.5 9 -8.5 -9 z" fill="#d1006d"/>
  <circle cx="118" cy="116" r="1.4" fill="#ffd84d"/><circle cx="123" cy="124" r="1.4" fill="#ffd84d"/><circle cx="117" cy="131" r="1.4" fill="#ffd84d"/>

  <!-- Neck and head -->
  <rect x="114" y="88" width="12" height="13" fill="#e2b590"/>
  <circle cx="120" cy="72" r="20" fill="#e2b590"/>
  <path d="M100 70 Q96 44 122 46 Q146 46 141 70 Q138 56 122 58 Q106 57 100 70 Z" fill="#3b2a20"/>
  <path d="M118 47 Q128 36 138 44" stroke="#3b2a20" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Sunglasses and a huge grin -->
  <path d="M104 70 H136" stroke="#1f1f1f" stroke-width="2"/>
  <rect x="104" y="68" width="14" height="9" rx="3" fill="#1f1f1f"/>
  <rect x="122" y="68" width="14" height="9" rx="3" fill="#1f1f1f"/>
  <path d="M111 82 Q120 92 129 82 Z" fill="#ffffff" stroke="#3e3235" stroke-width="1.5"/>

  <!-- Sparkles -->
  <g fill="#ff5aa8">
    <path d="M44 74 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
    <path d="M198 128 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z"/>
    <path d="M60 236 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
    <path d="M190 220 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
  </g>
</svg>
