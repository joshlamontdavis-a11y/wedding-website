  <circle cx="127" cy="79" r="2.2" fill="#3e3235"/>
  <circle cx="108" cy="86" r="3.5" fill="#f2a1a1" opacity="0.6"/>
  <circle cx="132" cy="86" r="3.5" fill="#f2a1a1" opacity="0.6"/>
